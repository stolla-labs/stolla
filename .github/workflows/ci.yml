name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli
      - name: Test contracts
        run: cd contracts && cargo test
      - name: Build contracts
        run: cd contracts && CARGO_TARGET_DIR=target stellar contract build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reject nested workspace lockfile
        run: |
          if [ -f apps/web/package-lock.json ]; then
            echo "Invalid npm workspace layout:"
            echo "- apps/web/package-lock.json must not exist. Install dependencies from the repository root."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Validate workspace layout
        run: npm run check:workspace
      - name: Lint frontend
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck --workspace=web
      - name: Test frontend
        run: npm run test --workspace=web
      - name: Test production health checker
        run: node --test scripts/check-production-health.test.mjs
      - name: Build frontend
        run: npm run build --workspace=web
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx --workspace=web playwright install --with-deps chromium
      - name: Run multi-community browsing flow
        run: npm run test:e2e --workspace=web
        env:
          CI: true
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
